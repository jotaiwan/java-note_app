# Docker environment overrides

# Database - connect to host machine's PostgreSQL (not a container)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate auto-creates/updates missing tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update

# CORS - allow requests from nginx frontend (port 5000) and direct backend (port 5099)
server.port=5099
app.cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000,http://localhost:5099,http://127.0.0.1:5099

# Docs path inside container (host ./docs/ mounted to /app/docs)
app.docs.base-path=/app/docs

# Credentials file - SITES_CONFIGURATION_CREDENTIALS is resolved to /app/configs/sites/credentials.json
# inside the container (the host path is mounted there by docker-compose)
app.credential-file=${SITES_CONFIGURATION_CREDENTIALS:/app/configs/sites/credentials.json}

# Logging
logging.level.com.noteapp=INFO
