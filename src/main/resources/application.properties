spring.application.name=note-app
server.port=5000

# Database - reads from env vars exported in ~/.bashrc (NOTE_APP_JDBC_DB_URL, NOTE_APP_JDBC_DB_USER, NOTE_APP_JDBC_DB_PASSWORD)
spring.datasource.url=${NOTE_APP_JDBC_DB_URL:jdbc:postgresql://127.0.0.1:5432/note}
spring.datasource.username=${NOTE_APP_JDBC_DB_USER}
spring.datasource.password=${NOTE_APP_JDBC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload limits (for attachments stored in DB as BLOB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.com.noteapp=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS - allow React dev server
app.cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000,http://localhost:5099,http://127.0.0.1:5099

# Credentials file path - reads from env var exported in ~/.bashrc (SITES_CONFIGS_CREDENTIALS)
note.app.credential-file=${SITES_CONFIGS_CREDENTIALS}

# Docs base path (markdown docs)
note.app.docs.base-path=docs
